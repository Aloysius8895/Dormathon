<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP 3D 模型预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#edf2f5;font:14px system-ui,-apple-system,sans-serif;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{font-size:22px;letter-spacing:.05em;margin:0 0 8px;font-weight:500}p{color:#9ea9b5;margin:0;font-size:12px}.tag{color:#b5cfaa;font-size:10px;letter-spacing:.16em;margin-bottom:10px}nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#202831dd;border:1px solid #ffffff13;border-radius:18px;padding:9px}button,a{font:13px system-ui;color:#eee;background:#ffffff09;border:1px solid #ffffff10;border-radius:10px;padding:10px 16px;white-space:nowrap;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#ffffff19}a{background:#c4ee9a;color:#182414}aside{position:absolute;bottom:100px;width:100%;text-align:center;pointer-events:none;color:#87929f;font-size:12px}#err{position:absolute;top:40%;width:100%;text-align:center;color:#ffd098} @media(max-width:600px){header{left:20px;top:22px}h1{font-size:18px}nav{bottom:20px}button,a{padding:10px 12px}}
</style></head><body><canvas id="view"></canvas><header><div class="tag">REFERENCE RECONSTRUCTION · V1</div><h1>WHOOP / 3D 模型</h1><p>灰白机身 · 编织织带 · GLB 格式</p></header><div id="err"></div><aside>拖动旋转 · 滚轮缩放 · 手机双指缩放</aside><nav><button id="spin">自动旋转</button><button id="reset">重置视角</button><a id="download" download="WHOOP_Reference_Model.glb">下载 GLB</a></nav><script>
const encoded='__GLB_BASE64__';const raw=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));document.getElementById('download').href=URL.createObjectURL(new Blob([raw],{type:'model/gltf-binary'}));
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.getElementById('err').textContent='浏览器未启用 WebGL。请使用 Chrome 或 Edge 打开。';throw Error('WebGL unavailable')}
if(!gl.getExtension('OES_element_index_uint'))throw Error('32 bit indices unavailable');
const vs=`attribute vec3 position;attribute vec3 normal;uniform mat3 rotation;uniform float distance;uniform float aspect;varying vec3 n;varying vec3 point;void main(){vec3 p=rotation*position;n=rotation*normal;point=p;float d=distance-p.z;float f=3.1716;gl_Position=vec4(p.x*f/aspect,p.y*f,1.001*d-.002001,d);}`;
const fs=`precision highp float;varying vec3 n;varying vec3 point;uniform vec3 color;uniform float metal;uniform float rough;void main(){vec3 N=normalize(n);vec3 L=normalize(vec3(-.5,.8,1.));float lam=max(dot(N,L),0.);float rim=max(dot(N,normalize(vec3(.9,.1,.35))),0.);vec3 C=color*(.25+.75*lam+.23*rim);vec3 H=normalize(L+vec3(0.,0.,1.));float spec=pow(max(dot(N,H),0.),mix(100.,15.,rough));C+=spec*mix(.08,.4,metal);gl_FragColor=vec4(pow(C,vec3(.68)),1.);}`;
function shader(type,text){let s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const attr={p:gl.getAttribLocation(prog,'position'),n:gl.getAttribLocation(prog,'normal')};const un={};for(let key of ['rotation','distance','aspect','color','metal','rough'])un[key]=gl.getUniformLocation(prog,key);
gl.enable(gl.DEPTH_TEST);gl.clearColor(.063,.078,.098,1);
let data=new DataView(raw.buffer),jsonLen=data.getUint32(12,true);const doc=JSON.parse(new TextDecoder().decode(raw.slice(20,20+jsonLen)));const binStart=28+jsonLen;
function readAccess(index){let a=doc.accessors[index],v=doc.bufferViews[a.bufferView],start=binStart+(v.byteOffset||0)+(a.byteOffset||0),len=a.count*(a.type==='VEC3'?3:1);let ctor=a.componentType===5126?Float32Array:a.componentType===5125?Uint32Array:Uint16Array;return new ctor(raw.buffer,start,len)}
function buffer(target,values){let b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,values,gl.STATIC_DRAW);return b}
let parts=[];for(let mesh of doc.meshes)for(let p of mesh.primitives){const idx=readAccess(p.indices);parts.push({pos:buffer(gl.ARRAY_BUFFER,readAccess(p.attributes.POSITION)),norm:buffer(gl.ARRAY_BUFFER,readAccess(p.attributes.NORMAL)),idx:buffer(gl.ELEMENT_ARRAY_BUFFER,idx),count:idx.length,mat:doc.materials[p.material].pbrMetallicRoughness})}
let yaw=.56,pitch=.22,roll=-.21,dist=.17,auto=false,lastTime=0;
function mul(a,b){let c=Array(9).fill(0);for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<3;k++)c[i*3+j]+=a[i*3+k]*b[k*3+j];return c}
function rotation(){let c=Math.cos,s=Math.sin;let ry=[c(yaw),0,s(yaw),0,1,0,-s(yaw),0,c(yaw)];let rx=[1,0,0,0,c(pitch),-s(pitch),0,s(pitch),c(pitch)];let rz=[c(roll),-s(roll),0,s(roll),c(roll),0,0,0,1];let m=mul(mul(rz,rx),ry);return [m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]]}
function frame(t){if(auto&&lastTime)yaw+=(t-lastTime)*.00018;lastTime=t;let dpr=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix3fv(un.rotation,false,rotation());gl.uniform1f(un.distance,dist);gl.uniform1f(un.aspect,w/h);for(let p of parts){gl.bindBuffer(gl.ARRAY_BUFFER,p.pos);gl.enableVertexAttribArray(attr.p);gl.vertexAttribPointer(attr.p,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,p.norm);gl.enableVertexAttribArray(attr.n);gl.vertexAttribPointer(attr.n,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.idx);gl.uniform3fv(un.color,p.mat.baseColorFactor.slice(0,3));gl.uniform1f(un.metal,p.mat.metallicFactor);gl.uniform1f(un.rough,p.mat.roughnessFactor);gl.drawElements(gl.TRIANGLES,p.count,gl.UNSIGNED_INT,0)}window.modelReady=true;requestAnimationFrame(frame)}requestAnimationFrame(frame);
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=0});canvas.addEventListener('pointermove',e=>{let prev=pointers.get(e.pointerId);if(!prev)return;pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw+=(e.clientX-prev[0])*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-prev[1])*.007))}else{let [a,b]=[...pointers.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)dist=Math.max(.095,Math.min(.4,dist*pinch/d));pinch=d}});for(let type of ['pointerup','pointercancel'])canvas.addEventListener(type,e=>{pointers.delete(e.pointerId);pinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(.095,Math.min(.4,dist*Math.exp(e.deltaY*.001)))},{passive:false});document.getElementById('spin').onclick=()=>{auto=!auto;document.getElementById('spin').textContent=auto?'暂停旋转':'自动旋转'};document.getElementById('reset').onclick=()=>{yaw=.56;pitch=.22;roll=-.21;dist=innerWidth<600?.23:.17;auto=false;document.getElementById('spin').textContent='自动旋转'};if(innerWidth<600)dist=.23;
</script></body></html>
